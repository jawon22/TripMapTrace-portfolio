server.port=8080

spring.application.name=tripmaptrace-backend
spring.profiles.active=dev

spring.datasource.username=tripmaptrace
spring.datasource.password=${DB_PASSWORD:tripmaptrace}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#--- jwt setting ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

#--- FCM setting ---
app.fcm.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}

#--- aws s3 setting ---
app.s3.region=us-east-1
app.s3.bucket=tripmaptrace-media

#--- email (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME}

#--- holiday api ---
app.holiday.api-key=${HOLIDAY_API_KEY}

#--- error response ---
server.error.include-message=always
